[workspace]
name = "basic_locomotion_isaaclab_env"
platforms = [
  "linux-64",
  "linux-aarch64",  # Jetson (deploy only)
  # Apple Silicon (deploy only); robostack lyrical needs macOS >= 14
  { name = "osx-arm64-14", platform = "osx-arm64", macos = "14.0" },
  # Isaac Lab 3 Omniverse wheels are manylinux_2_35 (Ubuntu 22.04+)
  { name = "linux-64-glibc-2-35", platform = "linux-64", glibc = "2.35" },
]
channels = ["conda-forge", "nvidia"]

[feature.common]
platforms = ["linux-64", "linux-aarch64", "osx-arm64-14"]

[feature.common.dependencies]
pip = "*"
python = "*"
numpy = "*"
compilers = "*"
cmake = "*"
pkg-config = "*"
make = "*"
ninja = "*"
colcon-common-extensions = "*"
catkin_tools = "*"
rosdep = "*"
tqdm = "*"
gymnasium = "*"

[feature.common.pypi-dependencies]
readchar = "*"
onnxruntime = "*"
mujoco = "*"
scipy = "*"

[feature.common.activation.env]
# Restrict DDS discovery to this machine. Each distro reads only one of the two:
# humble -> ROS_LOCALHOST_ONLY; jazzy+/lyrical -> ROS_AUTOMATIC_DISCOVERY_RANGE
# (ros_environment otherwise defaults it to SUBNET, i.e. the whole LAN).
ROS_LOCALHOST_ONLY = "1"
ROS_AUTOMATIC_DISCOVERY_RANGE = "LOCALHOST"

[feature.humble]
channels = ["https://prefix.dev/robostack-humble"]

[feature.humble.dependencies]
ros-humble-desktop = "*"
ros-humble-rmw-cyclonedds-cpp = "*"
ros-humble-rosidl-generator-dds-idl = "*"
ros-humble-plotjuggler-ros = "*"

[feature.lyrical]
channels = ["https://repo.prefix.dev/robostack-lyrical"]

[feature.lyrical.dependencies]
ros-lyrical-desktop = "*"
ros-lyrical-rmw-cyclonedds-cpp = "*"
ros-lyrical-rosidl-generator-dds-idl = "*"
ros-lyrical-plotjuggler-ros = "*"

# ---------------------------------------------------------------------------
# Training: Isaac Lab release from PyPI (lightweight, no Isaac Sim / Kit)
# ---------------------------------------------------------------------------
[feature.train]
platforms = ["linux-64-glibc-2-35"]

[feature.train.dependencies]
python = "3.12.*"
pip = "*"
setuptools = "<82"  # torch 2.11 requires setuptools<82

[feature.train.pypi-dependencies]
isaaclab = { version = "==3.0.0", extras = ["all", "wandb"] }
basic_locomotion_isaaclab = { path = "source/basic_locomotion_isaaclab", editable = true }

[feature.train.pypi-options]
extra-index-urls = ["https://pypi.nvidia.com", "https://download.pytorch.org/whl/cu130"]
index-strategy = "unsafe-best-match"
# Mirrors Isaac Lab's [tool.uv].override-dependencies (not inherited from the wheel)
dependency-overrides = { packaging = ">=20,<27" }

[environments]
# `pixi shell` (no -e) activates ROS 2 lyrical
default = ["common", "lyrical"]
train = ["train"]
humble = ["common", "humble"]
lyrical = ["common", "lyrical"]
