name: basic_locomotion_isaaclab_env
# Force ROS 2 to use localhost at startup for safety.
# This value can still be overridden after activating the environment.
variables:
  ROS_LOCALHOST_ONLY: "1"
channels:
- conda-forge
- nvidia
- https://prefix.dev/robostack-lyrical
dependencies:
- pip
- python
- numpy
- cuda-nvcc 
- ros-lyrical-desktop
- ros-lyrical-rmw-cyclonedds-cpp
- ros-lyrical-rosidl-generator-dds-idl
- ros-lyrical-plotjuggler-ros
- ros-lyrical-librealsense2
- ros-lyrical-realsense2-camera-msgs
- ros-lyrical-realsense2-camera
- compilers 
- cmake 
- pkg-config 
- make 
- ninja 
- colcon-common-extensions 
- catkin_tools 
- rosdep
- tqdm
- gymnasium
- pip:
  - readchar
  - onnxruntime
  - torch
  - scipy
  - mujoco